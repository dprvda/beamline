name: iOS Simulator qualification (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    name: ${{ matrix.app }} / iOS Simulator, Mobile Safari
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [vite, next]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tests/public-proof
      - run: node tests/public-proof/prepare.mjs ${{ matrix.app }}
      - name: Enable Apple's WebDriver
        run: sudo safaridriver --enable
      - name: iPhone Simulator, Mobile Safari
        run: node tests/public-proof/run.mjs ${{ matrix.app }} ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-qualification-${{ matrix.app }}
          path: tests/public-proof/results/
          retention-days: 30
