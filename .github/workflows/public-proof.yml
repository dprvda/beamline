name: Public sample proof
on:
  push:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browsers:
    name: ${{ matrix.app }} / Chromium, Firefox, WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [vite, next]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tests/public-proof
      - run: npx --prefix tests/public-proof playwright install --with-deps chromium firefox webkit
      - run: node tests/public-proof/prepare.mjs ${{ matrix.app }}
      - run: node tests/public-proof/run.mjs ${{ matrix.app }} playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-proof-linux-${{ matrix.app }}
          path: tests/public-proof/results/
          retention-days: 30
  apple:
    name: ${{ matrix.app }} / Safari and iOS Simulator (qualification)
    runs-on: macos-latest
    timeout-minutes: 40
    # Keep non-required until evidence establishes repeatable runner support.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: [vite, next]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tests/public-proof
      - run: node tests/public-proof/prepare.mjs ${{ matrix.app }}
      - name: Enable Apple's WebDriver
        run: sudo safaridriver --enable
      - name: Safari on macOS
        id: safari
        continue-on-error: true
        run: node tests/public-proof/run.mjs ${{ matrix.app }} safari
      - name: iPhone Simulator, Mobile Safari
        id: ios
        continue-on-error: true
        run: node tests/public-proof/run.mjs ${{ matrix.app }} ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-proof-apple-${{ matrix.app }}
          path: tests/public-proof/results/
          retention-days: 30
      - name: Expose optional qualification failures
        if: steps.safari.outcome == 'failure' || steps.ios.outcome == 'failure'
        run: exit 1
